name: 目标高校进校信息监控

on:
  schedule:
    # 北京时间 08-20 点每小时 = UTC 00-12 点，整点 7 分触发
    # 共 13 次/天，即使被限流也能保证足够的实际执行次数
    - cron: "7 0-12 * * *"
  workflow_dispatch:  # 允许手动触发
  repository_dispatch:  # 允许外部 webhook 触发（绕开 cron 限流）
    types: [daily-check]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install requests beautifulsoup4

      - name: 运行检查脚本
        id: check
        continue-on-error: true  # 即使检查失败也继续部署
        run: python check.py

      - name: 提交数据更新
        if: always()
        run: |
          git config user.name "秋招情报员"
          git config user.email "campus-bot@example.com"
          git add data/universities.json
          if git diff --staged --quiet; then
            echo "无数据变更"
          else
            git commit -m "📊 自动更新: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M') 检查结果"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: 设置 GitHub Pages
        uses: actions/configure-pages@v4

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 打印看板地址
        run: |
          echo "📱 看板已更新: ${{ steps.deployment.outputs.page_url }}"
