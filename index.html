<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秋招监控看板</title>
<style>
  /* ===== 全局变量 ===== */
  :root {
    --bg: #1a1a2e; --card: #16213e; --text: #e0e0e0;
    --text-secondary: #a0a0b0; --accent: #4e8cff;
    --green: #34d399; --yellow: #fbbf24; --orange: #fb923c;
    --red: #f87171; --border: #2a2a4a;
    --tag-green-bg: rgba(52,211,153,.15); --tag-yellow-bg: rgba(251,191,36,.15);
    --tag-gray-bg: rgba(160,160,176,.1); --tag-blue-bg: rgba(78,140,255,.15);
    --h-color: #f59e0b; --c-color: #06b6d4;
    --h-bg: rgba(245,158,11,.1); --c-bg: rgba(6,182,212,.1);
    --h-border: rgba(245,158,11,.25); --c-border: rgba(6,182,212,.25);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}

  /* ===== 密码锁屏 ===== */
  #lockScreen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column}
  #lockScreen .lock-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:32px 24px;text-align:center;max-width:320px;width:90%}
  #lockScreen .lock-icon{font-size:2.4rem;margin-bottom:12px}
  #lockScreen h2{font-size:1.1rem;margin-bottom:6px}
  #lockScreen .hint{font-size:.74rem;color:var(--text-secondary);margin-bottom:18px}
  #lockScreen input{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.9rem;text-align:center;outline:none;letter-spacing:2px}
  #lockScreen input:focus{border-color:var(--accent)}
  #lockScreen button{margin-top:12px;width:100%;padding:10px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:.9rem;font-weight:600;cursor:pointer}
  #lockScreen .err{color:var(--red);font-size:.74rem;margin-top:8px;display:none}
  #mainContent{display:none}

  /* ===== 页头 ===== */
  .container{max-width:1000px;margin:0 auto}
  .header{text-align:center;padding:20px 0 12px}
  .header h1{font-size:1.6rem;font-weight:700;margin-bottom:4px}
  .header .sub{color:var(--text-secondary);font-size:.82rem}
  .update-time{display:inline-block;margin-top:6px;background:var(--card);padding:4px 12px;border-radius:20px;font-size:.72rem;color:var(--text-secondary)}

  /* ===== Tab 切换 ===== */
  .tab-bar{display:flex;justify-content:center;gap:0;margin-bottom:18px;background:var(--card);border-radius:12px;padding:4px;border:1px solid var(--border);max-width:420px;margin-left:auto;margin-right:auto}
  .tab-btn{flex:1;padding:10px 0;border:none;background:transparent;color:var(--text-secondary);font-size:.85rem;font-weight:600;cursor:pointer;border-radius:10px;transition:all .25s;position:relative}
  .tab-btn:hover{color:var(--text)}
  .tab-btn.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(78,140,255,.35)}
  .tab-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle;position:relative;top:-1px}
  .tab-dot.campus-dot{background:var(--green)}
  .tab-dot.company-dot{background:var(--orange)}

  /* ===== 统计卡片 ===== */
  .stats{display:grid;gap:10px;margin-bottom:18px}
  .campus-stats{grid-template-columns:repeat(4,1fr)}
  .company-stats{grid-template-columns:repeat(5,1fr)}
  .stat-card{background:var(--card);border-radius:10px;padding:14px;text-align:center;border:1px solid var(--border);transition:transform .2s}
  .stat-card:hover{transform:translateY(-2px)}
  .stat-card .num{font-size:1.6rem;font-weight:800}
  .stat-card .label{font-size:.68rem;color:var(--text-secondary);margin-top:2px}
  .stat-card.all .num{color:var(--accent)}
  .stat-card.pub .num{color:var(--green)}
  .stat-card.part .num{color:var(--yellow)}
  .stat-card.pend .num{color:var(--text-secondary)}
  .stat-card.hw .num{color:var(--h-color)}
  .stat-card.cx .num{color:var(--c-color)}
  .stat-card.both .num{color:var(--green)}
  .stat-card.none .num{color:var(--text-secondary)}

  /* ===== 筛选按钮 ===== */
  .filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .filter-btn{padding:6px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text-secondary);font-size:.78rem;cursor:pointer;transition:all .2s;user-select:none}
  .filter-btn:hover{border-color:var(--accent);color:var(--text)}
  .filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(78,140,255,.3)}

  /* ===== 表格 ===== */
  .table-wrap{background:var(--card);border-radius:10px;border:1px solid var(--border);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:.82rem}
  th{text-align:left;padding:8px 10px;background:rgba(0,0,0,.2);color:var(--text-secondary);font-weight:600;font-size:.7rem;position:sticky;top:0}
  td{padding:7px 10px;border-top:1px solid var(--border);vertical-align:middle}
  tr.main-row{cursor:pointer}
  tr.main-row td:first-child::after{content:' ▸';color:var(--text-secondary);font-size:.65rem;opacity:.5}
  tr.main-row:hover td{background:rgba(78,140,255,.06)}
  .tag{display:inline-block;padding:1px 6px;border-radius:10px;font-size:.65rem;font-weight:600;white-space:nowrap;margin-left:4px}
  .tag-pub{background:var(--tag-green-bg);color:var(--green)}
  .tag-part{background:var(--tag-yellow-bg);color:var(--yellow)}
  .tag-pend{background:var(--tag-gray-bg);color:var(--text-secondary)}
  .tag-urgent{background:rgba(251,146,60,.15);color:var(--orange)}
  .date-hl{color:var(--accent);font-weight:600;white-space:nowrap}
  .date-warn{color:var(--yellow);font-weight:600;white-space:nowrap}
  .no-data{color:var(--text-secondary);font-style:italic}
  .link-btn{display:inline-block;text-decoration:none;font-size:.78rem;color:var(--accent);padding:2px 6px;border-radius:6px;transition:all .2s}
  .link-btn:hover{background:rgba(78,140,255,.15)}
  .detail-row{display:none}
  .detail-row.open{display:table-row}
  .detail-row td{padding:12px 14px;background:rgba(0,0,0,.15);font-size:.74rem;color:var(--text-secondary)}

  /* ===== 秋招看板专用 ===== */
  .campus-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
  .campus-detail-grid .k{color:var(--text-secondary);flex-shrink:0}
  .campus-detail-grid .v{color:var(--text)}
  .badge{display:inline-block;margin-left:6px;font-size:.65rem;color:var(--orange);font-weight:600}
  th.col-h{color:var(--h-color)} th.col-c{color:var(--c-color)}

  /* ===== 企业看板专用 ===== */
  .uni-name{font-weight:600;white-space:nowrap}
  .cell-card{display:inline-block;border-radius:8px;padding:4px 10px;font-size:.72rem;transition:all .2s}
  .cell-h{background:var(--h-bg);border:1px solid var(--h-border)}
  .cell-c{background:var(--c-bg);border:1px solid var(--c-border)}
  .cell-none{background:var(--tag-gray-bg);color:var(--text-secondary);font-size:.7rem;padding:3px 8px;border-radius:8px;font-style:italic}
  .cell-date{font-weight:700;font-size:.76rem}
  .cell-venue{font-size:.66rem;color:var(--text-secondary);display:block;margin-top:1px}
  .cell-time{font-size:.68rem;opacity:.8}
  .tag-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle}
  .dot-h{background:var(--h-color)} .dot-c{background:var(--c-color)}
  .detail-section{margin-bottom:10px}
  .detail-section:last-child{margin-bottom:0}
  .detail-section .s-title{font-weight:700;color:var(--text);font-size:.78rem;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .detail-section .s-title .badge-badge{padding:1px 7px;border-radius:8px;font-size:.65rem}
  .detail-section .s-title .badge-h{background:var(--h-bg);color:var(--h-color)}
  .detail-section .s-title .badge-c{background:var(--c-bg);color:var(--c-color)}
  .detail-section .s-title .badge-none{background:var(--tag-gray-bg);color:var(--text-secondary)}
  .event-card{background:rgba(0,0,0,.12);border-radius:8px;padding:8px 12px;margin-bottom:6px;border-left:3px solid var(--border)}
  .event-card.h-event{border-left-color:var(--h-color)}
  .event-card.c-event{border-left-color:var(--c-color)}
  .event-card .e-row{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.72rem}
  .event-card .e-item{display:flex;align-items:center;gap:4px}
  .event-card .e-label{color:var(--text-secondary);flex-shrink:0}
  .event-card .e-val{color:var(--text)}
  .event-link{display:inline-block;margin-top:4px;font-size:.7rem;color:var(--accent);text-decoration:none}
  .event-link:hover{text-decoration:underline}
  .source-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.64rem;background:rgba(78,140,255,.1);color:var(--accent);border:1px solid rgba(78,140,255,.2)}
  .no-event{color:var(--text-secondary);font-style:italic;padding:4px 0}
  .timeline{margin-top:4px;font-size:.66rem;color:var(--text-secondary)}

  /* ===== 图例 & 页脚 ===== */
  .legend{display:flex;gap:16px;margin-top:14px;font-size:.72rem;color:var(--text-secondary);flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:4px}
  .loading-text{text-align:center;padding:40px;color:var(--text-secondary)}
  .footer{text-align:center;padding:28px 0;color:var(--text-secondary);font-size:.7rem}

  /* ===== 面板显隐 ===== */
  .panel{display:none}
  .panel.active{display:block}

  /* ===== 响应式 ===== */
  @media(max-width:640px){
    .header h1{font-size:1.3rem}
    .campus-stats{grid-template-columns:repeat(2,1fr)}
    .company-stats{grid-template-columns:repeat(3,1fr)}
    .tab-bar{max-width:340px}
    th,td{padding:5px 6px;font-size:.64rem}
    th{font-size:.6rem}
    .tag{padding:1px 4px;font-size:.6rem}
    .link-btn{font-size:.7rem;padding:1px 4px}
    .filter-btn{padding:6px 10px;font-size:.72rem}
    .filter-bar{gap:5px}
    .campus-detail-grid{grid-template-columns:1fr}
    .cell-card{padding:3px 7px;font-size:.66rem}
    .cell-date{font-size:.7rem}
    .cell-venue{font-size:.62rem}
    .event-card .e-row{gap:4px 10px;font-size:.66rem}
    .table-wrap{overflow-x:auto}
    table{min-width:520px}
  }
</style>
</head>
<body>

<!-- ===== 密码锁屏 ===== -->
<div id="lockScreen">
  <div class="lock-box">
    <div class="lock-icon">🔒</div>
    <h2>秋招监控看板</h2>
    <div class="hint">27所目标高校 · 秋招进校 + 企业宣讲会</div>
    <input type="password" id="pwdInput" placeholder="输入密码" autofocus>
    <button onclick="verify()">确认</button>
    <div class="err" id="pwdErr">密码错误，请重试</div>
  </div>
</div>

<!-- ===== 主内容 ===== -->
<div id="mainContent">
<div class="container">

  <!-- 页头 -->
  <div class="header">
    <h1 id="headerTitle">🎯 秋招监控看板</h1>
    <div class="sub">27 所目标高校 · 2027 届秋季校园招聘</div>
    <div class="update-time" id="updateTime">加载中...</div>
  </div>

  <!-- Tab 切换 -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tabCampus" onclick="switchTab('campus')">
      <span class="tab-dot campus-dot"></span> 秋招进校
    </button>
    <button class="tab-btn" id="tabCompany" onclick="switchTab('company')">
      <span class="tab-dot company-dot"></span> 企业宣讲会
    </button>
  </div>

  <!-- ========== 看板1: 秋招进校 ========== -->
  <div class="panel active" id="panelCampus">
    <div class="stats campus-stats" id="campusStats"></div>
    <div class="filter-bar" id="campusFilterBar"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>高校</th><th>场地预约</th><th>进校启动</th><th>原文</th></tr></thead>
        <tbody id="campusTableBody"><tr><td colspan="4" class="loading-text">正在加载数据...</td></tr></tbody>
      </table>
    </div>
    <div class="legend">
      <span><span class="tag tag-pub">已发布</span> 正式通知</span>
      <span><span class="tag tag-part">部分信息</span> 双选会已出</span>
      <span><span class="tag tag-pend">待发布</span> 未发布</span>
      <span><span class="tag tag-urgent">重点关注</span> 随时发布</span>
    </div>
  </div>

  <!-- ========== 看板2: 企业宣讲会 ========== -->
  <div class="panel" id="panelCompany">
    <div class="stats company-stats" id="companyStats"></div>
    <div class="filter-bar" id="companyFilterBar"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>高校</th><th class="col-h">华为</th><th class="col-c">长鑫存储</th></tr></thead>
        <tbody id="companyTableBody"><tr><td colspan="3" class="loading-text">正在加载数据...</td></tr></tbody>
      </table>
    </div>
    <div class="legend">
      <span><span class="tag-dot dot-h"></span> 华为有宣讲</span>
      <span><span class="tag-dot dot-c"></span> 长鑫存储有宣讲</span>
      <span>⚪ 暂未发布</span>
      <span>—— 仅展示2027届秋招宣讲会</span>
    </div>
  </div>

  <div class="footer">李双利 · 每日 8 次自动更新 · GitHub Actions 驱动</div>
</div>
</div><!-- /mainContent -->

<script>
// ==================== 共享状态 ====================
let activeTab = 'campus';
let CAMPUS_DATA = [], COMPANY_DATA = [];
let campusLoaded = false, companyLoaded = false;

// ==================== 密码 ====================
const PWD_HASH = '2a135ed1f95982f85a4b2e636479b520177e1ebad2917dbcb72c414278bd9752';

async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function verify() {
  const input = document.getElementById('pwdInput').value;
  const hash = await sha256(input);
  if (hash === PWD_HASH) {
    sessionStorage.setItem('campus_auth', '1');
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    loadCurrentTab();
  } else {
    document.getElementById('pwdErr').style.display = 'block';
    document.getElementById('pwdInput').value = '';
    document.getElementById('pwdInput').focus();
  }
}

document.getElementById('pwdInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') verify();
});

// ==================== Tab 切换 ====================
function switchTab(tab) {
  if (activeTab === tab) return;
  activeTab = tab;
  
  document.getElementById('tabCampus').classList.toggle('active', tab === 'campus');
  document.getElementById('tabCompany').classList.toggle('active', tab === 'company');
  document.getElementById('panelCampus').classList.toggle('active', tab === 'campus');
  document.getElementById('panelCompany').classList.toggle('active', tab === 'company');

  if (tab === 'campus') {
    document.getElementById('headerTitle').textContent = '🎯 秋招进校监控看板';
    document.querySelector('.sub').textContent = '27 所目标高校 · 2027 届秋季校园招聘';
  } else {
    document.getElementById('headerTitle').textContent = '🏢 企业宣讲会监控看板';
    document.querySelector('.sub').textContent = '华为 & 长鑫存储 · 2027 届秋季校招';
  }
  loadCurrentTab();
}

function loadCurrentTab() {
  if (activeTab === 'campus' && !campusLoaded) loadCampus();
  else if (activeTab === 'company' && !companyLoaded) loadCompany();
}

// ==================== 看板1: 秋招进校 ====================
let campusFilter = 'all';

async function loadCampus() {
  try {
    const resp = await fetch('data/universities.json?' + Date.now());
    const json = await resp.json();
    CAMPUS_DATA = json.universities;
    document.getElementById('updateTime').textContent = '最后更新：' + json.last_updated;
    campusLoaded = true;
  } catch(e) {
    document.getElementById('campusTableBody').innerHTML = '<tr><td colspan="4" class="loading-text">⚠️ 数据加载失败，请稍后刷新</td></tr>';
    console.error(e);
    return;
  }
  renderCampus();
}

function campusCount(s){ return CAMPUS_DATA.filter(d=>d.status===s).length }

function renderCampus(){
  const pub=campusCount('published'), part=campusCount('partial'), pend=campusCount('pending');
  document.getElementById('campusStats').innerHTML = `
    <div class="stat-card all"><div class="num">${CAMPUS_DATA.length}</div><div class="label">监控高校</div></div>
    <div class="stat-card pub"><div class="num">${pub}</div><div class="label">通知已发布</div></div>
    <div class="stat-card part"><div class="num">${part}</div><div class="label">部分信息</div></div>
    <div class="stat-card pend"><div class="num">${pend}</div><div class="label">尚未发布</div></div>`;
  document.getElementById('campusFilterBar').innerHTML = `
    <button class="filter-btn ${campusFilter==='all'?'active':''}" onclick="campusFilterFn('all')">全部 ${CAMPUS_DATA.length}</button>
    <button class="filter-btn ${campusFilter==='published'?'active':''}" onclick="campusFilterFn('published')">🟢 已发布 ${pub}</button>
    <button class="filter-btn ${campusFilter==='partial'?'active':''}" onclick="campusFilterFn('partial')">🟡 部分信息 ${part}</button>
    <button class="filter-btn ${campusFilter==='pending'?'active':''}" onclick="campusFilterFn('pending')">⚪ 待发布 ${pend}</button>`;

  const list = campusFilter==='all' ? CAMPUS_DATA : CAMPUS_DATA.filter(d=>d.status===campusFilter);
  document.getElementById('campusTableBody').innerHTML = list.map((d)=>{
    const idx = CAMPUS_DATA.indexOf(d);
    const s = d.status;
    const tag = d.urgent ? '<span class="tag tag-urgent">⚠ 重点关注</span>' :
      s==='published' ? '<span class="tag tag-pub">已发布</span>' :
      s==='partial' ? '<span class="tag tag-part">部分信息</span>' :
      '<span class="tag tag-pend">待发布</span>';
    const bk = s==='published' ? `<span class="date-hl">${d.booking_open||'—'}</span>` : `<span class="no-data">${d.booking_open||'—'}</span>`;
    const et = s==='published' ? `<span class="date-hl">${d.entry_start||'—'}</span>` : `<span class="no-data">${d.entry_start||'—'}</span>`;
    const notice = d.notice_title ? `${d.notice_title}<br><span style="font-size:.7rem;color:var(--text-secondary)">${d.notice_date||''}</span>` : '—';
    const detail = [
      ['通知', notice],['场地预约', d.booking_open||'—'],['进校招聘', d.entry_start||'—'],
      ['联系方式', d.contact||'—'],['就业网', d.employment_url||''],['公众号', d.wechat_name||'']
    ];
    if(d.notes) detail.push(['备注', d.notes]);
    const linkBtn = d.notice_url_link
      ? `<a href="${d.notice_url_link}" target="_blank" rel="noopener" class="link-btn"><svg width="13" height="13" viewBox="0 0 24 24" style="vertical-align:-2px"><rect x="2" y="3" width="20" height="16" rx="5" fill="#07C160"/><path d="M7 9h10M7 13h6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></a>`
      : `<span class="no-data">—</span>`;
    return `<tr class="main-row" onclick="campusToggle(${idx})">
      <td>${d.name}${d.urgent?' <span class="badge">⚠</span>':''}${tag}</td>
      <td>${bk}</td><td>${et}</td><td onclick="event.stopPropagation()">${linkBtn}</td>
    </tr>
    <tr class="detail-row" id="cd-${idx}">
      <td colspan="4"><div class="campus-detail-grid">${detail.map(([k,v])=>`<div style="display:flex;gap:4px"><span class="k">${k}：</span><span class="v">${v}</span></div>`).join('')}</div></td>
    </tr>`;
  }).join('');
}

function campusToggle(i){ document.getElementById('cd-'+i).classList.toggle('open') }
function campusFilterFn(f){ campusFilter=f; renderCampus() }

// ==================== 看板2: 企业宣讲会 ====================
let companyFilter = 'all';
const CSTATUS = {not_found:'⚪ 暂未发布', scheduled:'🟢 已发布', checking:'🔄 检查中'};

async function loadCompany() {
  try {
    const resp = await fetch('data/companies.json?' + Date.now());
    const json = await resp.json();
    COMPANY_DATA = json.universities;
    document.getElementById('updateTime').textContent = '最后更新：' + json.last_updated;
    companyLoaded = true;
  } catch(e) {
    document.getElementById('companyTableBody').innerHTML = '<tr><td colspan="3" class="loading-text">⚠️ 数据加载失败，请稍后刷新</td></tr>';
    console.error(e);
    return;
  }
  renderCompany();
}

function companyCount(key){
  return COMPANY_DATA.filter(d => { const c = key==='huawei'?d.huawei:d.cxmt; return c && c.status==='scheduled'; }).length;
}

function renderCompany(){
  const hw=companyCount('huawei'), cx=companyCount('cxmt');
  const both=COMPANY_DATA.filter(d=>d.huawei?.status==='scheduled'&&d.cxmt?.status==='scheduled').length;
  const none=COMPANY_DATA.filter(d=>d.huawei?.status==='not_found'&&d.cxmt?.status==='not_found').length;

  document.getElementById('companyStats').innerHTML = `
    <div class="stat-card all"><div class="num">${COMPANY_DATA.length}</div><div class="label">监控高校</div></div>
    <div class="stat-card hw"><div class="num">${hw}</div><div class="label">华为有宣讲</div></div>
    <div class="stat-card cx"><div class="num">${cx}</div><div class="label">长鑫存储有宣讲</div></div>
    <div class="stat-card both"><div class="num">${both}</div><div class="label">均有宣讲</div></div>
    <div class="stat-card none"><div class="num">${none}</div><div class="label">均未发布</div></div>`;

  document.getElementById('companyFilterBar').innerHTML = `
    <button class="filter-btn ${companyFilter==='all'?'active':''}" onclick="companyFilterFn('all')">全部 ${COMPANY_DATA.length}</button>
    <button class="filter-btn ${companyFilter==='huawei'?'active':''}" onclick="companyFilterFn('huawei')">● 华为有宣讲 ${hw}</button>
    <button class="filter-btn ${companyFilter==='cxmt'?'active':''}" onclick="companyFilterFn('cxmt')">● 长鑫存储有宣讲 ${cx}</button>
    <button class="filter-btn ${companyFilter==='both'?'active':''}" onclick="companyFilterFn('both')">均有宣讲 ${both}</button>
    <button class="filter-btn ${companyFilter==='none'?'active':''}" onclick="companyFilterFn('none')">均未发布 ${none}</button>`;

  let list = COMPANY_DATA;
  if (companyFilter==='huawei') list=COMPANY_DATA.filter(d=>d.huawei?.status==='scheduled');
  else if (companyFilter==='cxmt') list=COMPANY_DATA.filter(d=>d.cxmt?.status==='scheduled');
  else if (companyFilter==='both') list=COMPANY_DATA.filter(d=>d.huawei?.status==='scheduled'&&d.cxmt?.status==='scheduled');
  else if (companyFilter==='none') list=COMPANY_DATA.filter(d=>d.huawei?.status==='not_found'&&d.cxmt?.status==='not_found');

  document.getElementById('companyTableBody').innerHTML = list.map((d)=>{
    const idx = COMPANY_DATA.indexOf(d);
    return `<tr class="main-row" onclick="companyToggle(${idx})">
      <td><span class="uni-name">${d.name}</span></td>
      ${renderCell(d.huawei,'h')}${renderCell(d.cxmt,'c')}
    </tr>
    <tr class="detail-row" id="cmd-${idx}">
      <td colspan="3">${renderCompanyDetail(d)}</td>
    </tr>`;
  }).join('');
}

function renderCell(cd,cls){
  if(!cd||cd.status==='not_found') return `<td><span class="cell-none">${cd?.status?CSTATUS[cd.status]:'⚪ 暂未发布'}</span></td>`;
  if(cd.status==='scheduled'&&cd.events&&cd.events.length>0){
    const e=cd.events[0];
    return `<td>
      <div class="cell-card cell-${cls}">
        <span class="cell-date">${e.date||'待定'}</span>
        <span class="cell-time">${e.time||''}</span>
        <span class="cell-venue">${e.venue||''}</span>
      </div>
      ${cd.events.length>1?`<span class="timeline">+${cd.events.length-1}场</span>`:''}
    </td>`;
  }
  return `<td><span class="cell-none">${CSTATUS[cd.status]||'—'}</span></td>`;
}

function renderCompanyDetail(d){
  let html='';
  html+=renderOneCompany(d.huawei,'华为','h');
  html+=renderOneCompany(d.cxmt,'长鑫存储','c');
  if(d.notes) html+=`<div class="detail-section"><div class="s-title">📝 备注</div><div style="font-size:.72rem">${d.notes}</div></div>`;
  return html||'<div class="no-event">暂无宣讲会信息</div>';
}

function renderOneCompany(cd,cname,cls){
  const hasEvents=cd?.status==='scheduled'&&cd?.events&&cd.events.length>0;
  let html=`<div class="detail-section">
    <div class="s-title">
      <span class="badge-badge badge-${cls}">●</span> ${cname}
      <span class="badge-badge badge-${hasEvents?cls:'none'}">${cd?.status?CSTATUS[cd.status]:CSTATUS.not_found}</span>
    </div>`;
  if(hasEvents){
    cd.events.forEach(e=>{
      html+=`<div class="event-card ${cls}-event">
        <div class="e-row">
          <span class="e-item"><span class="e-label">📅</span><span class="e-val">${e.date||'待定'}</span></span>
          <span class="e-item"><span class="e-label">🕐</span><span class="e-val">${e.time||'待定'}</span></span>
          <span class="e-item"><span class="e-label">📍</span><span class="e-val">${e.venue||'待定'}</span></span>
          ${e.type?`<span class="e-item"><span class="e-label">📋</span><span class="e-val">${e.type}</span></span>`:''}
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap">
          ${e.source_label?`<span class="source-tag">📡 ${e.source_label}</span>`:''}
          ${e.source_url?`<a href="${e.source_url}" target="_blank" rel="noopener" class="event-link">查看原文 →</a>`:''}
        </div>
        ${e.notes?`<div style="font-size:.66rem;color:var(--text-secondary);margin-top:2px">${e.notes}</div>`:''}
      </div>`;
    });
  }else{html+='<div class="no-event">暂无宣讲会安排</div>'}
  html+='</div>';
  return html;
}

function companyToggle(i){ document.getElementById('cmd-'+i).classList.toggle('open') }
function companyFilterFn(f){ companyFilter=f; renderCompany() }

// ==================== 启动 ====================
if (sessionStorage.getItem('campus_auth') === '1') {
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('mainContent').style.display = 'block';
  loadCampus();
}
</script>
</body>
</html>
