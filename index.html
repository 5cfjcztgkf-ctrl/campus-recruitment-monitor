<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秋招进校监控看板</title>
<style>
  :root {
    --bg: #1a1a2e; --card: #16213e; --text: #e0e0e0;
    --text-secondary: #a0a0b0; --accent: #4e8cff;
    --green: #34d399; --yellow: #fbbf24; --orange: #fb923c;
    --red: #f87171; --border: #2a2a4a;
    --tag-green-bg: rgba(52,211,153,.15);
    --tag-yellow-bg: rgba(251,191,36,.15);
    --tag-gray-bg: rgba(160,160,176,.1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
  .container{max-width:960px;margin:0 auto}
  .header{text-align:center;padding:24px 0 20px}
  .header h1{font-size:1.6rem;font-weight:700;margin-bottom:4px}
  .header .sub{color:var(--text-secondary);font-size:.82rem}
  .update-time{display:inline-block;margin-top:8px;background:var(--card);padding:4px 12px;border-radius:20px;font-size:.72rem;color:var(--text-secondary)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
  .stat-card{background:var(--card);border-radius:10px;padding:14px;text-align:center;border:1px solid var(--border);transition:transform .2s}
  .stat-card:hover{transform:translateY(-2px)}
  .stat-card .num{font-size:1.8rem;font-weight:800}
  .stat-card .label{font-size:.7rem;color:var(--text-secondary);margin-top:2px}
  .stat-card.pub .num{color:var(--green)}
  .stat-card.part .num{color:var(--yellow)}
  .stat-card.pend .num{color:var(--text-secondary)}
  .stat-card.all .num{color:var(--accent)}
  .filter-bar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .filter-btn{padding:5px 14px;border-radius:18px;border:1px solid var(--border);background:var(--card);color:var(--text-secondary);font-size:.76rem;cursor:pointer;transition:all .2s}
  .filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .table-wrap{background:var(--card);border-radius:10px;border:1px solid var(--border);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:.82rem}
  th{text-align:left;padding:10px 14px;background:rgba(0,0,0,.2);color:var(--text-secondary);font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0}
  td{padding:10px 14px;border-top:1px solid var(--border);vertical-align:middle}
  tr:hover td{background:rgba(78,140,255,.05)}
  .tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.7rem;font-weight:600;white-space:nowrap}
  .tag-pub{background:var(--tag-green-bg);color:var(--green)}
  .tag-part{background:var(--tag-yellow-bg);color:var(--yellow)}
  .tag-pend{background:var(--tag-gray-bg);color:var(--text-secondary)}
  .tag-urgent{background:rgba(251,146,60,.15);color:var(--orange)}
  .date-hl{color:var(--accent);font-weight:600;white-space:nowrap}
  .date-warn{color:var(--yellow);font-weight:600;white-space:nowrap}
  .no-data{color:var(--text-secondary);font-style:italic}
  .expand-btn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:.74rem}
  .link-btn{display:inline-block;text-decoration:none;font-size:1rem;padding:2px 6px;border-radius:6px;transition:all .2s}
  .link-btn:hover{background:rgba(78,140,255,.15);transform:scale(1.15)}
  .detail-row{display:none}
  .detail-row.open{display:table-row}
  .detail-row td{padding:12px 14px;background:rgba(0,0,0,.15);font-size:.74rem;color:var(--text-secondary)}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
  .detail-item{display:flex;gap:4px}
  .detail-item .k{color:var(--text-secondary);flex-shrink:0}
  .detail-item .v{color:var(--text)}
  .legend{display:flex;gap:14px;margin-top:14px;font-size:.72rem;color:var(--text-secondary);flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:4px}
  .loading{text-align:center;padding:40px;color:var(--text-secondary)}
  .footer{text-align:center;padding:28px 0;color:var(--text-secondary);font-size:.7rem}
  .badge{display:inline-block;margin-left:6px;font-size:.65rem;color:var(--orange);font-weight:600}
  @media(max-width:640px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .header h1{font-size:1.3rem}
    .detail-grid{grid-template-columns:1fr}
    .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{min-width:620px}
    th,td{white-space:nowrap;padding:8px 10px;font-size:.72rem}
    th{font-size:.68rem}
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎯 秋招进校监控看板</h1>
    <div class="sub">27 所目标高校 · 2027 届秋季校园招聘</div>
    <div class="update-time" id="updateTime">加载中...</div>
  </div>

  <div class="stats" id="stats"></div>
  <div class="filter-bar" id="filterBar"></div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>高校</th><th>状态</th><th>场地预约</th><th>进校启动</th><th>原文</th><th></th></tr></thead>
      <tbody id="tableBody"><tr><td colspan="6" class="loading">正在加载数据...</td></tr></tbody>
    </table>
  </div>

  <div class="legend">
    <span><span class="tag tag-pub">已发布</span> 正式通知</span>
    <span><span class="tag tag-part">部分信息</span> 双选会已出</span>
    <span><span class="tag tag-pend">待发布</span> 未发布</span>
    <span><span class="tag tag-urgent">重点关注</span> 随时发布</span>
  </div>
  <div class="footer">李双利 · 每日 8 次自动更新 · GitHub Actions 驱动</div>
</div>

<script>
let DATA = [];
let currentFilter = 'all';

async function load() {
  try {
    const resp = await fetch('data/universities.json?' + Date.now());
    const json = await resp.json();
    DATA = json.universities;
    document.getElementById('updateTime').textContent = '最后更新：' + json.last_updated;
  } catch(e) {
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" class="loading">⚠️ 数据加载失败，请稍后刷新</td></tr>';
    console.error(e);
    return;
  }
  render();
}

function count(s){return DATA.filter(d=>d.status===s).length}
function render(){
  const pub=count('published'), part=count('partial'), pend=count('pending');
  document.getElementById('stats').innerHTML = `
    <div class="stat-card all"><div class="num">${DATA.length}</div><div class="label">监控高校</div></div>
    <div class="stat-card pub"><div class="num">${pub}</div><div class="label">通知已发布</div></div>
    <div class="stat-card part"><div class="num">${part}</div><div class="label">部分信息</div></div>
    <div class="stat-card pend"><div class="num">${pend}</div><div class="label">尚未发布</div></div>`;
  document.getElementById('filterBar').innerHTML = `
    <button class="filter-btn active" onclick="filter('all')">全部 ${DATA.length}</button>
    <button class="filter-btn" onclick="filter('published')">🟢 已发布 ${pub}</button>
    <button class="filter-btn" onclick="filter('partial')">🟡 部分信息 ${part}</button>
    <button class="filter-btn" onclick="filter('pending')">⚪ 待发布 ${pend}</button>`;

  const list = currentFilter==='all' ? DATA : DATA.filter(d=>d.status===currentFilter);
  document.getElementById('tableBody').innerHTML = list.map((d,i)=>{
    const idx = DATA.indexOf(d);
    const s = d.status;
    const tag = d.urgent ? '<span class="tag tag-urgent">⚠ 重点关注</span>' :
      s==='published' ? '<span class="tag tag-pub">已发布</span>' :
      s==='partial' ? '<span class="tag tag-part">部分信息</span>' :
      '<span class="tag tag-pend">待发布</span>';
    const bk = s==='published' ? `<span class="date-hl">${d.booking_open||'—'}</span>` :
      `<span class="no-data">${d.booking_open||'—'}</span>`;
    const et = s==='published' ? `<span class="date-hl">${d.entry_start||'—'}</span>` :
      `<span class="no-data">${d.entry_start||'—'}</span>`;
    const notice = d.notice_title ? `${d.notice_title}<br><span style="font-size:.7rem;color:var(--text-secondary)">${d.notice_date||''}</span>` : '—';
    const detail = [
      ['通知', notice],['场地预约', d.booking_open||'—'],['进校招聘', d.entry_start||'—'],
      ['联系方式', d.contact||'—'],['就业网', d.employment_url||''],['公众号', d.wechat_name||'']
    ];
    if(d.notes) detail.push(['备注', d.notes]);
    const linkBtn = d.notice_url_link ? 
      `<a href="${d.notice_url_link}" target="_blank" rel="noopener" class="link-btn" title="查看微信推文原文"><svg width="14" height="14" viewBox="0 0 24 24" style="vertical-align:-2px"><rect x="2" y="3" width="20" height="16" rx="5" fill="#07C160"/><path d="M7 9h10M7 13h6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg> 原文</a>` :
      `<span class="no-data">—</span>`;
    return `<tr>
      <td>${d.name}${d.urgent?' <span class="badge">⚠</span>':''}</td>
      <td>${tag}</td>
      <td>${bk}</td>
      <td>${et}</td>
      <td>${linkBtn}</td>
      <td><button class="expand-btn" onclick="toggle(${idx})">详情 ▾</button></td>
    </tr>
    <tr class="detail-row" id="d-${idx}">
      <td colspan="6"><div class="detail-grid">${detail.map(([k,v])=>`<div class="detail-item"><span class="k">${k}：</span><span class="v">${v}</span></div>`).join('')}</div></td>
    </tr>`;
  }).join('');
}

function toggle(i){
  const r=document.getElementById('d-'+i);
  r.classList.toggle('open');
  r.previousElementSibling.querySelector('.expand-btn').textContent = r.classList.contains('open')?'收起 ▴':'详情 ▾';
}

function filter(f){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.textContent.includes(f==='all'?'全部':f==='published'?'已发布':f==='partial'?'部分':'待发布')));
  render();
}

load();
</script>
</body>
</html>
